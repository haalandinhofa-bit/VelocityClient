name: Build Velocity Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 4.9
        run: |
          curl -L --retry 3 https://services.gradle.org/distributions/gradle-4.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
      - name: Build
        run: ./gradle-4.9/bin/gradle build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VelocityClient
          path: build/libs/*.jar
